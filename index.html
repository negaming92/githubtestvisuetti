<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flores Amarillas para Ti</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(to bottom, #fff8dc, #ffe082);
      text-align: center;
      color: #333;
    }
    .card {
      max-width: 600px;
      margin: 60px auto;
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }
    h1 {
      color: #fbc02d;
      font-size: 2.2em;
    }
    p {
      font-size: 1.2em;
      margin: 20px 0;
    }
    .flowers img {
      width: 150px;
      margin: 10px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .snoopy img {
      width: 200px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌼 Flores Amarillas para Ti mi linda 🌼</h1>
    <p>Porque mereces algo especial y lleno de alegría mi Greta 💛</p>
    <div class="flowers">
      <img src="https://m.media-amazon.com/images/I/91m1rvJlUwL._UF894,1000_QL80_.jpg" alt="Ramo de flores amarillas">
      <img src="https://flowerbox.pe/wp-content/uploads/2023/03/descarga.jpg" alt="Girasoles amarillos">
    </div>
    <p>Y como no podía faltar...</p>
    <div class="snoopy">
      <img src="https://i.pinimg.com/564x/02/b5/7c/02b57c3754ed1cb84e36a2015fcf840d.jpg" alt="Snoopy con flores">
      <p style="font-style: italic;">Snoopy también te manda flores 💐🐾</p>
    </div>
  </div>
</body>
</html>
